<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Progress | Fab Path</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<header class="topbar">

    <a
        href="index.html"
        class="logo"
    >
        FAB PATH
    </a>


    <nav>

        <a href="learn.html">
            Learn
        </a>

        <a href="practice.html">
            Practice
        </a>

        <a
            href="progress.html"
            class="active-nav"
        >
            Progress
        </a>

    </nav>


    <div class="user-stats">

        <span>
            🔥
            <span id="streakDisplay">
                0
            </span>
        </span>

        <span>
            ⚡
            <span id="totalXPDisplay">
                0
            </span>
            XP
        </span>

    </div>

</header>


<main class="progress-page">


    <section class="progress-header">

        <p class="eyebrow">
            YOUR PROGRESS
        </p>

        <h1>
            Your Fab Path journey.
        </h1>

    </section>


    <section class="stats-grid">


        <div class="stat-card">

            <span>🔥</span>

            <h2 id="progressStreak">
                0
            </h2>

            <p>
                Day Streak
            </p>

        </div>


        <div class="stat-card">

            <span>⚡</span>

            <h2 id="progressXP">
                0
            </h2>

            <p>
                Total XP
            </p>

        </div>


        <div class="stat-card">

            <span>✓</span>

            <h2 id="lessonsCompleted">
                0
            </h2>

            <p>
                Lessons Completed
            </p>

        </div>


        <div class="stat-card">

            <span>📈</span>

            <h2 id="progressPercent">
                0%
            </h2>

            <p>
                Course Complete
            </p>

        </div>


    </section>

</main>


<script src="script.js"></script>

</body>

</html>
