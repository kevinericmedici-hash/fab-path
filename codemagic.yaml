workflows:
  ios-workflow:
    name: Fab Path iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: fab-path-appstore-admin
    environment:
      groups:
        - ios_signing
      xcode: latest
      node: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.fabpath.app"
        APP_STORE_APPLE_ID: "6817148624"
    scripts:
      - name: Install npm dependencies
        script: |
          cd mobile
          npm ci

      - name: Sync site content into www/
        script: |
          cd mobile
          npm run sync

      - name: Capacitor sync (iOS)
        script: |
          cd mobile
          npx cap sync ios

      - name: Increment build number
        script: |
          cd mobile/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))

      - name: Set up keychain for code signing
        script: keychain initialize

      - name: Fetch signing files (creates them if they don't exist yet)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Install the signing certificate
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build ipa
        script: |
          cd mobile
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Requires the App Store Connect integration above and an API key
      # with at least App Manager access, set up in Codemagic's UI.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
